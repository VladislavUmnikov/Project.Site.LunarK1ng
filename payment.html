<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата - LunarK1ng</title>
    <link rel="shortcut icon" href="./assects/logo.png" type="icon/png">
    <link rel="stylesheet" href="./css/payment.css">
    <script src="./js/payment.js" defer></script>
</head>
<body>
    <nav>
        <div class="nav">
            <img src="./assects/logo.png" width="58px" height="58px">
            <div class="btn-menu"><a href="index.html">Главное</a></div>
            <div class="btn-menu"><a href="index.html#description">Описание</a></div>
            <div class="btn-menu"><a href="index.html#shop">Магазин</a></div>
            <div class="btn-menu"><a href="https://t.me/tg_lunark1ng" target="_blank" class="telegram-link">Telegram</a></div>
        </div>
    </nav>

    <main>
        <div class="payment-container">
            <div class="payment-header">
                <h1>Оплата</h1>
            </div>

            <div class="payment-content">
                <div class="order-summary">
                    <h2>Детали заказа</h2>
                    <div class="summary-item">
                        <span class="summary-label">Товар:</span>
                        <span class="summary-value" id="product-name">Премиум подписка</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Сумма:</span>
                        <span class="summary-value" id="product-price">299₽</span>
                    </div>
                    <div class="summary-total">
                        <span class="summary-label">Итого:</span>
                        <span class="summary-value" id="total-price">299₽</span>
                    </div>
                </div>

                <div class="payment-form-container">
                    <form class="payment-form" id="payment-form">
                        <h2>Данные карты</h2>
                        
                        <div class="bank-card">
                            <div class="card-chip"></div>
                            <div class="card-logo">VISA</div>
                            
                            <div class="card-number-field">
                                <div class="card-number-display" id="card-number-display">**** **** **** ****</div>
                                <input type="text" id="card-number" name="card-number" maxlength="19" required>
                            </div>
                            
                            <div class="card-holder-field">
                                <label for="cardholder">ИМЯ ДЕРЖАТЕЛЯ</label>
                                <input type="text" id="cardholder" name="cardholder" placeholder="IVAN IVANOV" required>
                            </div>
                            
                            <div class="card-bottom">
                                <div class="card-expiry-field">
                                    <label for="expiry">СРОК ДЕЙСТВИЯ</label>
                                    <input type="text" id="expiry" name="expiry" placeholder="MM/YY" maxlength="5" required>
                                </div>
                                <div class="card-cvv-field">
                                    <label for="cvv">CVV</label>
                                    <input type="text" id="cvv" name="cvv" placeholder="000" maxlength="3" required>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                        </div>

                        <button type="submit" class="pay-button">
                            <span>Оплатить</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2024 LunarK1ng. Все права защищены.</p>
        </div>
    </footer>
</body>
</html>
